name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: maven
      - name: Verify and report coverage
        run: ./scripts/coverage.sh --batch-mode --no-transfer-progress -Drailix.test.forks=2
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('modules/railix-creator/target/site/jacoco-aggregate/index.html') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: modules/railix-creator/target/site/jacoco-aggregate/
      - name: Preserve test failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-failure-evidence
          path: |
            modules/*/target/surefire-reports/
            modules/*/target/failsafe-reports*/
            modules/railix-creator/target/browser-diagnostics/
