<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Railix Creator</title>
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTIiIGZpbGw9IiNkOTUwMmYiLz48cGF0aCBkPSJNMTggMTRoMTdjMTAgMCAxNiA1IDE2IDE0IDAgNi0zIDExLTkgMTNsMTAgMTNINDBsLTgtMTFoLTN2MTFIMTh6bTExIDEwdjloNmM0IDAgNi0xIDYtNSAwLTMtMi00LTYtNHoiIGZpbGw9IiNmZmYiLz48L3N2Zz4=">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></span>
      <span><strong id="project-title">Opening project</strong><small>Railix Creator</small></span>
    </div>
    <button class="build-indicator" type="button" popovertarget="application-status" aria-label="Application build and runtime details"><strong id="build-state" role="status">Loading</strong></button>
    <section id="application-status" popover aria-label="Application and build"></section>
  </header>
  <main class="creator-shell">
    <section class="canvas-panel" aria-label="Project graph">
      <div id="graph" class="graph-stage" tabindex="0" aria-label="Flow diagram. Scroll to zoom, drag or Shift-scroll to pan.">
        <canvas id="world-canvas" aria-hidden="true"></canvas>
        <div id="world-labels"></div>
        <div id="trigger-example" data-world-overlay hidden></div>
        <p id="world-error" role="alert" hidden></p>
        <nav class="canvas-tools" aria-label="Canvas controls">
          <button type="button" id="zoom-out" aria-label="Zoom out">-</button>
          <output id="zoom-level" aria-live="polite">100%</output>
          <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
          <button type="button" id="zoom-fit">Fit</button>
        </nav>
      </div>
    </section>
    <section id="selection-dock" aria-label="Selected station" hidden>
      <div id="dock-content"></div>
      <div class="dock-tools">
        <button type="button" id="open-inspector" aria-label="Open Inspector">Configure</button>
        <button type="button" id="dock-focus" aria-label="Focus selected Step">Locate</button>
      </div>
    </section>
    <aside id="inspector" class="inspector" aria-label="Inspector" hidden>
      <button id="close-inspector" type="button" aria-label="Close Inspector" title="Close Inspector (Escape)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6L18 18M18 6L6 18"/></svg>
      </button>
      <div id="inspector-content"></div>
    </aside>
  </main>
  <footer class="status-rail" aria-label="Application status">
    <span id="flow-count">0 flows</span>
    <span id="step-count">0 steps</span>
    <label id="status-coverage" hidden><progress max="1" value="0" aria-label="Example Step coverage"></progress><span></span></label>
    <span id="status-pid" hidden></span>
    <span id="status-uptime" hidden></span>
    <span id="status-memory" hidden></span>
    <span id="status-cpu" hidden></span>
    <span id="status-executions" hidden></span>
    <span id="status-observations" hidden role="status"></span>
    <span class="status-build-time">Last build <time id="last-build">Not built</time></span>
  </footer>
  <div id="overlay"></div>
  <script src="/vendor/pixi-8.20.1.min.js" defer></script>
  <script src="/vendor/pixi-csp-8.20.1.min.js" defer></script>
  <script src="/world.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
