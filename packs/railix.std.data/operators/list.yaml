operators:
  - id: railix.op.list.map
    inputs: { source: { type: list<any>, required: true } }
    config: { mapping: { type: expression, required: true } }
    outputs: { result: { type: list<any> } }
  - id: railix.op.list.filter
    inputs: { source: { type: list<any>, required: true } }
    config: { predicate: { type: expression, required: true } }
    outputs: { result: { type: list<any> } }
  - id: railix.op.list.count
    inputs: { source: { type: list<any>, required: true } }
    outputs: { result: { type: number } }
