operators:
  - id: railix.op.math.binary
    inputs:
      left: { type: number, required: true }
      right: { type: number, required: true }
    config:
      op: { type: enum, values: [add, subtract, multiply, divide, greaterThan, lessThan, equals] }
    outputs:
      result: { type: number|boolean }
  - id: railix.op.math.abs
    inputs: { value: { type: number, required: true } }
    outputs: { result: { type: number } }
