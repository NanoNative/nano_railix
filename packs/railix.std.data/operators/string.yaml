operators:
  - id: railix.op.string.trim
    inputs: { value: { type: string, required: true } }
    outputs: { result: { type: string } }
  - id: railix.op.string.lower
    inputs: { value: { type: string, required: true } }
    outputs: { result: { type: string } }
  - id: railix.op.string.upper
    inputs: { value: { type: string, required: true } }
    outputs: { result: { type: string } }
  - id: railix.op.string.template
    inputs: { values: { type: object, required: false } }
    config: { template: { type: string, required: true } }
    outputs: { result: { type: string } }
