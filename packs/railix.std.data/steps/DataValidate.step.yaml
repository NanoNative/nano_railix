id: railix.std.data.DataValidate
version: 0.1.0
kind: normal
displayName: Data Validate
summary: Validate required paths, types, patterns, ranges, and list constraints.
inputs:
  payload: { type: document, required: false }
  ctx: { type: document, required: false }
outputs:
  validation: { type: document, target: ctx.validation }
outcomes:
  valid: {}
  invalid: {}
  error: {}
config:
  rules: { type: validation-rule-list, editor: dataworkbench.validate }
cache:
  default: { mode: none }
ui:
  editor: dataworkbench.validate
