operators:
  - id: railix.op.math.abs
    uiExample:
      fields:
        - name: value
          input: single
          type: number
  - id: railix.op.math.binary
    uiExample:
      fields:
        - name: left
          input: single
          type: number
        - name: op
          input: enum
          values: [add, subtract, multiply, divide]
        - name: right
          input: single
          type: number
  - id: railix.op.value.coalesce
    uiExample:
      fields:
        - name: values
          input: dynamic-list
          type: any
          min: 1
