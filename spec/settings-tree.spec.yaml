settingsTree:
  description: Unified config and secrets tree.
  scopes:
    - app
    - environment
    - flow
    - group
    - step
    - run
  precedence:
    - packaged-defaults
    - environment-defaults
    - settings-file
    - encrypted-settings-file
    - environment-variables
    - cli-args
    - manual-run-input
  entry:
    fields:
      path: string
      type: string|int|decimal|bool|duration|list|object|file|url
      value: railixValue|encryptedValue|reference
      required: boolean
      secret: boolean
      encrypted: boolean
      source: string
      visibility: normal|masked|hidden
      audit: never|on-read|on-materialize|always
      overridePolicy: allow|deny|trusted-only
  rules:
    - secret metadata is sticky through inheritance
    - secret values are not included in cache keys
    - secret materialization emits automatic audit signals
    - UI must show source and presence, not secret value
